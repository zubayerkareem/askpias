# One-server deployment: MySQL + Laravel admin/API + the Node site.
#
#   cp .env.docker.example .env      # then fill APP_KEY / passwords
#   docker compose up -d --build
#
# The API container runs migrations and creates the admin on every start
# (backend/docker/askpias-init.sh), so a fresh volume is installed automatically.

name: askpias

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-askpias}
      MYSQL_USER: ${DB_USERNAME:-askpias}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_ROOT_PASSWORD:-rootsecret}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: AskPias
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${API_URL:-http://localhost:8000}
      APP_KEY: ${APP_KEY:?set APP_KEY (php artisan key:generate --show)}
      FRONTEND_URL: ${SITE_URL:-http://localhost:3000}
      FRONTEND_URLS: ${SITE_URL:-http://localhost:3000}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-askpias}
      DB_USERNAME: ${DB_USERNAME:-askpias}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@askpias.com}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123}
      SEED_DEMO: ${SEED_DEMO:-true}
    volumes:
      - uploads:/var/www/html/storage/app/public
    # No host port: Dokploy/Traefik reaches the container by domain.
    # For plain `docker compose up` on a dev box, add:  ports: ["8000:8080"]
    expose:
      - "8080"

  web:
    # Opt-in only: Dokploy deploys the site as its own Application (root Dockerfile),
    # because compose-level domain routing is less reliable there. Local full stack:
    #   docker compose --profile full up -d --build
    profiles:
      - full
    build:
      context: .
      args:
        VITE_API_URL: ${API_URL:-http://localhost:8000}/api
        VITE_ADMIN_URL: ${API_URL:-http://localhost:8000}/admin
        VITE_GTM_ID: ${GTM_ID:-}
    restart: unless-stopped
    depends_on:
      - api
    # Same here: binding 3000 collides with the Dokploy panel.
    # Local dev override:  ports: ["3000:3000"]
    expose:
      - "3000"

volumes:
  db-data:
  uploads:
